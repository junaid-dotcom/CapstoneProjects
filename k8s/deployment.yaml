apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbite-web
  labels:
    app: quickbite-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickbite-web
  template:
    metadata:
      labels:
        app: quickbite-web
    spec:
      containers:
        - name: web
          image: DOCKERHUB_USERNAME/quickbite-web:latest
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quickbite-web
spec:
  selector:
    app: quickbite-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
