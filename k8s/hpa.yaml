apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quickbite-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quickbite-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
