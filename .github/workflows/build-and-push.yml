name: Build and publish QuickBite
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-web:latest,${{ secrets.DOCKERHUB_USERNAME }}/quickbite-web:${{ github.sha }}
      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error -X POST -H 'Content-type: application/json' --data '{"text":"QuickBite image published successfully from GitHub Actions."}' "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL is not configured; skipping notification."
          fi
